document_type: "Cameroon_Passport"
backgrounds:
  - "data/bg/cameroon_passport/passport_blank.png"
fonts: "data/fonts/"
json_samples:
  - "data/json/passport_sample.json"
fields:
  # --- FRONT only (1080x810) ---
  # Header row: type | country_code | passport_number
  - name: "type"
    position: [386, 85]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "country_code"
    position: [501, 85]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "passport_number"
    position: [711, 86]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  # Row 1: surname
  - name: "surname"
    position: [385, 129]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  # Row 2: given_names
  - name: "given_names"
    position: [385, 169]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  # Row 3: nationality | occupation
  - name: "nationality"
    position: [380, 214]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "occupation"
    position: [718, 214]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  # Row 4: date_of_birth | height | can
  - name: "date_of_birth"
    position: [385, 258]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "height"
    position: [715, 258]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "can"
    position: [867, 258]
    font: "arial.ttf"
    letter_spacing: 4
    weight: "bold"
    size: 20
    side: "front"
  # Row 5: sex | place_of_birth
  - name: "sex"
    position: [385, 305]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "place_of_birth"
    position: [504, 305]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  # Row 6: issue_date | place_of_issue
  - name: "issue_date"
    position: [387, 351]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  - name: "place_of_issue"
    position: [725, 351]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"
  # Row 7: expiry_date
  - name: "expiry_date"
    position: [385, 398]
    font: "arial.ttf"
    weight: "bold"
    size: 20
    side: "front"

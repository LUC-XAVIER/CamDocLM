    font: "Roboto-VariableFont_wdth,wght.ttf"
    size: 16
    side: "back"
  - name: "height"
    position: [395, 793]
    font: "Roboto-VariableFont_wdth,wght.ttf"
    size: 16
    side: "back"
  - name: "nic_number"
